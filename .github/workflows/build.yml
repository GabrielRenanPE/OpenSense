name: Build e testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev libgl1-mesa-dev
      - name: Sintaxe dos scripts
        run: |
          bash -n install.sh uninstall.sh
          for script in drivers/*.sh; do bash -n "$script"; done
      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar aplicativo e auxiliares
        run: cmake --build build --parallel 2
      - name: Testar sem hardware
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
